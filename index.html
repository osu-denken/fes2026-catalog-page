<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>大学祭2026カタログ</title>
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <main class="catalog">
            <div class="list">

                <a class="card" href="http://localhost:8000">
                    <img src="https://osu-denken.net/image/works/drive-by-camera_2.jpg" alt="カメラでドライブ！＆Motion Canvas Effects">
                    <div class="card-content">
                        <div class="card-header">
                            <h2>カメラでドライブ！＆MotionCFX</h2>
                            <span class="badge">ハッカソン作品</span>
                        </div>
                        <p>カメラから手で車を操作するゲームとエネルギーのオーブを放つ！</p>
                    </div>
                </a>

                <a class="card" href="https://osu-denken.github.io/phone-and-shoot/host/">
                    <img src="https://osu-denken.net/image/works/phoneandshoot_2.jpg" alt="phone ∧ shoot">
                    <div class="card-content">
                        <div class="card-header">
                            <h2>phone ∧ shoot</h2>
                            <span class="badge">ハッカソン作品</span>
                        </div>
                        <p>スマホを傾けて遊ぶシューティングゲーム</p>
                    </div>
                </a>

                <a class="card" href="http://localhost:8001">
                    <img src="https://osu-denken.net/image/works/typinggame.jpg" alt="タイピングゲーム">
                    <div class="card-content">
                        <div class="card-header">
                            <h2>タイピングゲーム</h2>
                            <span class="badge">ハッカソン作品</span>
                        </div>
                        <p>画面上の文字をタイプしていくゲーム！</p>
                    </div>
                </a>


                <a class="card" href="https://osu-denken.net/arena-shooter/">
                    <img src="https://osu-denken.net/arena-shooter/shots/arena-shooter_1.jpg" alt="アリーナ・シューター">
                    <div class="card-content">
                        <div class="card-header">
                            <h2>アリーナ・シューター</h2>
                            <span class="badge member">部員作品</span>
                        </div>
                        <p>銃と剣で敵を倒していくアクションゲーム！</p>
                    </div>
                </a>


                <a class="card" href="https://kmmz.jp/sql-dungeons/">
                    <img src="https://kmmz.jp/upload/sqldungeons-1.png" alt="SQLダンジョン">
                    <div class="card-content">
                        <div class="card-header">
                            <h2>SQLダンジョン</h2>
                            <span class="badge member">部員作品</span>
                        </div>
                        <p>SQLをゲーム感覚で学習できるウェブアプリ</p>
                    </div>
                </a>


                <a class="card" href="#none" aria-disabled="true">
                    <div class="empty-card">
                        <span>none</span>
                    </div>
                    <div class="card-content">
                        <div class="card-header">
                            <h2>none</h2>
                        </div>
                        <p>none</p>
                    </div>
                </a>

            </div>
        </main>
    </body>
</html>
